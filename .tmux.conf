unbind C-b                                                                      # unmap Ctrl-B
set -g prefix C-a                                                               # Ctrl-A is the new prefix

bind a send-prefix                                                              # allow Ctrl-A,A <command> to send commands to nested tmux sessions
unbind r                                                                        # unmap Ctrl-A,R
bind r source-file ~/.tmux.conf \; display "reloaded"                           # Ctrl-A,R forces a settings reload from the config file

set -g history-limit 10000                                                      # set scrollback to 10000 lines
set -g escape-time 0                                                            # allow faster key repetition
setw -g aggressive-resize on                                                    # constrain window size to the maximum size of any client connected to that window instead of session
set -s set-clipboard on                                                         # let programs inside tmux set the clipboard via OSC 52
set -g focus-events on                                                          # forward focus in/out events to programs
set -as terminal-features "xterm*:RGB:hyperlinks"                               # enable true color and OSC 8 hyperlinks

set -g mouse on                                                                 # enable mouse support
setw -g monitor-activity on                                                     # monitor window for changes
set -g visual-activity on                                                       # show status line message in case of activity in other windows

set-option -g base-index 1                                                      # set window index from 0 to 1
setw -g pane-base-index 1                                                       # set pane index from 0 to 1
set -g renumber-windows on                                                      # renumber windows sequentially after closing one

bind -n C-n new-session                                                         # Ctrl-N spawns a new session
bind -n S-F2 command-prompt "rename-session %%"                                 # Shift-F2 renames session
bind -n C-o choose-session                                                      # Ctrl-O gives option to choose session
bind -n C-s setw synchronize-panes                                              # Ctrl-S synchronizes the input for all panes
bind -n F4 kill-session                                                         # F4 kills session

bind -n C-t new-window -c "#{pane_current_path}"                                # Ctrl-T spawns a new tab
bind -n F2 command-prompt "rename-window %%"                                    # F2 renames window
set-window-option -g window-status-current-style bg=red,fg=black                # set window status bar colors
set-window-option -g window-status-activity-style fg=magenta,bg=black           # set window status bar colors for activity alerts
set-window-option -g allow-passthrough on                                       # pass along terminal escape sequences
bind -n M-J select-window -t:-1                                                 # Alt-Shift-J switches to left window
bind -n M-L select-window -t:+1                                                 # Alt-Shift-L switches to right window
bind -n C-q kill-window                                                         # Ctrl-Q kills window

bind -n M-m split-window -v -c "#{pane_current_path}"                           # Alt-M splits window vertically
bind -n M-n split-window -h -c "#{pane_current_path}"                           # Alt-N splits window horizontally
bind -n M-i select-pane -U                                                      # Alt-I switches to top pane
bind -n M-j select-pane -L                                                      # Alt-J switches to left pane
bind -n M-k select-pane -D                                                      # Alt-K switches to bottom pane
bind -n M-l select-pane -R                                                      # Alt-L switches to right pane

bind -T copy-mode-vi v send -X begin-selection                                  # v starts a selection in copy mode
bind -T copy-mode-vi C-v send -X rectangle-toggle                               # Ctrl-V toggles rectangle selection in copy mode
bind -T copy-mode-vi y send -X copy-selection-and-cancel                        # y copies the selection and exits copy mode

set -g status-right '%a, %H:%M %Z, %d %b '                                      # customize status bar

source-file -q ~/.tmux.conf.local                                               # load per-host overrides, if present
